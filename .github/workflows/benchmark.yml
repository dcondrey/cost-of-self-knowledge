name: self-introspection-benchmark

# Runs the cross-substrate self-introspection cost benchmark on three OS runners.
# Trigger automatically on push, or manually from the Actions tab (workflow_dispatch).
# Each job uploads its machine's benchmark_result.json as an artifact; download them into
# embodied/results/ and run `python embodied/aggregate.py`.
on:
  push:
  workflow_dispatch:

jobs:
  benchmark:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install numpy
        run: python -m pip install --quiet numpy
      - name: run benchmark
        working-directory: embodied
        run: python benchmark.py
      - name: upload result
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ matrix.os }}
          path: embodied/benchmark_result.json
